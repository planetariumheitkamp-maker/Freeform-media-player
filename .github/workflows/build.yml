name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Renderer, unit, and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit tests
        run: npm test
      - name: Run renderer and browser tests
        run: npm run test:e2e

  package:
    name: Package ${{ matrix.artifact }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: freeform-Windows
          - os: macos-latest
            artifact: freeform-macOS
          - os: ubuntu-latest
            artifact: freeform-Linux
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build native packages
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged Windows app
        if: matrix.os == 'windows-latest'
        run: npm run test:desktop -- "release/win-unpacked/Freeform.exe"
      - name: Upload macOS and Linux packages
        if: matrix.os != 'windows-latest'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish latest Windows download
        if: matrix.os == 'windows-latest' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release/Freeform-*-win-x64.exe)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "Expected exactly one Windows installer, found ${#installers[@]}."
            exit 1
          fi
          installer="${installers[0]}"
          archive="${installer%.exe}.zip"
          test -f "$archive"
          version="${installer##*Freeform-}"
          version="${version%-win-x64.exe}"
          checksum="$(sha256sum "$installer")"
          checksum="${checksum%% *}"
          cat > release-notes.md <<EOF
          ## Download for Windows

          Download and run \`${installer##*/}\` to install Freeform on 64-bit Windows.

          For the portable version, download \`${archive##*/}\`, extract it, and run \`Freeform.exe\`.

          Built from commit \`${GITHUB_SHA}\` after renderer, unit, browser, and packaged-desktop tests passed.

          The installer is unsigned, so Windows SmartScreen may request confirmation.

          SHA-256: \`${checksum}\`
          EOF
          tag="windows-build-${GITHUB_RUN_NUMBER}"
          title="Freeform ${version} for Windows (build ${GITHUB_RUN_NUMBER})"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$installer" "$archive" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file release-notes.md --latest
          else
            gh release create "$tag" "$installer" "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              --latest
          fi
